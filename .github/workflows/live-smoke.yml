name: Live CRM Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'login.html'
      - 'styles.css'
      - 'app.js'
      - 'app-config.js'
      - 'data-provider.js'
      - 'firebase-adapter.js'
      - 'request-pdf-parser.js'
      - 'scripts/live-smoke.mjs'
      - '.github/workflows/live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live smoke test
        env:
          CRM_BASE_URL: https://jyhome1228-cyber.github.io/jnccrm
        run: |
          mkdir -p artifacts
          node scripts/live-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-live-smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore
