name: Live CRM Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'login.html'
      - 'styles.css'
      - 'app.js'
      - 'app-config.js'
      - 'data-provider.js'
      - 'firebase-adapter.js'
      - 'request-pdf-parser.js'
      - 'scripts/live-smoke.mjs'
      - '.github/workflows/live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start CRM test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jnccrm-http.log 2>&1 &
          sleep 2
      - name: Run browser smoke test
        env:
          CRM_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p artifacts
          node scripts/live-smoke.mjs
      - name: Verify live deployed PDF parser
        if: github.event_name == 'push'
        run: |
          set -e
          LIVE="https://jyhome1228-cyber.github.io/jnccrm"
          OK=0
          for i in $(seq 1 20); do
            echo "Live deployment check attempt $i"
            HTML=$(curl -fsSL "$LIVE/index.html?sha=${GITHUB_SHA}&attempt=$i" || true)
            if echo "$HTML" | grep -q "request-pdf-parser.js?v=20261002-pdf6" && \
               echo "$HTML" | grep -q "app.js?v=20261002-pdf6"; then
              PARSER=$(curl -fsSL "$LIVE/request-pdf-parser.js?sha=${GITHUB_SHA}&attempt=$i" || true)
              APP=$(curl -fsSL "$LIVE/app.js?sha=${GITHUB_SHA}&attempt=$i" || true)
              if echo "$PARSER" | grep -q "function parseStructured" && \
                 echo "$APP" | grep -q "async function extractRequestPdfText"; then
                echo "LIVE_PDF_PARSER_OK"
                OK=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$OK" != "1" ]; then
            echo "Live site is not serving the latest PDF parser assets."
            exit 1
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-live-smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore
