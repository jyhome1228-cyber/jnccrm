<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JN COS TECH CRM</title>
  <meta name="description" content="JN COS TECH internal CRM" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">JN</div>
        <div><strong>JN COS TECH</strong><span>CRM</span></div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a class="nav-item" href="#dashboard" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a class="nav-item" href="#customers" data-view="customers"><i data-lucide="users"></i><span>Customers</span></a>
        <a class="nav-item" href="#leads" data-view="leads"><i data-lucide="user-plus"></i><span>Leads</span></a>
        <a class="nav-item" href="#projects" data-view="projects"><i data-lucide="folder-kanban"></i><span>Projects</span></a>
        <a class="nav-item" href="#samples" data-view="samples"><i data-lucide="flask-conical"></i><span>Samples</span></a>
        <a class="nav-item" href="#quotations" data-view="quotations"><i data-lucide="file-text"></i><span>Quotations</span></a>
        <a class="nav-item" href="#orders" data-view="orders"><i data-lucide="shopping-cart"></i><span>Orders</span></a>
        <a class="nav-item" href="#operations" data-view="operations"><i data-lucide="blocks"></i><span>Operations</span></a>
        <a class="nav-item" href="#calendar" data-view="calendar"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
        <a class="nav-item" href="#settings" data-view="settings"><i data-lucide="settings"></i><span>Settings</span></a>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-card"><span>JN COS TECH</span><strong>Better Beauty<br/>Together.</strong><small>Internal Workspace</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <label class="search">
          <i data-lucide="search"></i>
          <input id="globalSearch" type="search" placeholder="Search customers, projects, orders..." />
          <kbd>/</kbd>
        </label>
        <div class="top-actions">
          <button class="icon-button notification-button" id="notificationButton" aria-label="Notifications">
            <i data-lucide="bell"></i><span class="notification-dot" id="notificationCount">0</span>
          </button>
          <button class="user-chip user-chip-button" id="userMenuButton" type="button">
            <div class="avatar" id="sessionAvatar">JN</div>
            <div class="user-copy"><strong id="sessionName">JN COS User</strong><span id="sessionRole">Staff</span></div>
            <i data-lucide="chevron-down"></i>
          </button>
        </div>
      </header>

      <section class="page" id="pageRoot"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="appModal">
    <div class="modal modal-large">
      <button class="modal-close" id="closeModal" type="button"><i data-lucide="x"></i></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <input type="file" id="dataImportInput" class="hidden" accept=".json,application/json" />
  <script src="./app-config.js"></script>
  <script src="./crm-store.js"></script>
  <script src="./firebase-adapter.js"></script>
  <script src="./data-provider.js"></script>
  <script src="./app.js"></script>
</body>
</html>
